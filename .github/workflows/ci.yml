name: CI

on:
    push:
        branches: [main, dev, test]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

            - name: Run test coverage
              run: npm run test:coverage
              docker:
                  runs-on: ubuntu-latest
                  needs: test

                  steps:
                      - name: Checkout code
                        uses: actions/checkout@v4

                      - name: Build Docker image
                        run: docker build -t aegis-gateway .

                      - name: Build user-service image
                        run: docker build -t aegis-user-service ./services/user-service

                      - name: Build product-service image
                        run: docker build -t aegis-product-service ./services/product-service
