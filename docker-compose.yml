version: "3.8"

services:
    gateway:
        build: .
        ports:
            - "8000:8000"
        environment:
            - REDIS_URL=redis://redis:6379
            - JWT_SECRET=super_secret_key_for_testing
        depends_on:
            - redis

    redis:
        image: redis:alpine
        ports:
            - "6379:6379"
